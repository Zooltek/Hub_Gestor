server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy — restringe origens de scripts, estilos e conexões
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Permissions Policy — desabilita APIs de hardware desnecessárias
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # HSTS — força HTTPS por 1 ano (incluindo subdomínios)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API Proxy to Hub API Backend (Produção Azure)
    location /api/ {
        proxy_pass https://amurahub.westus2.cloudapp.azure.com/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host amurahub.westus2.cloudapp.azure.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /alive {
        proxy_pass https://amurahub.westus2.cloudapp.azure.com/alive;
        proxy_ssl_server_name on;
        proxy_set_header Host amurahub.westus2.cloudapp.azure.com;
    }

    location /health {
        proxy_pass https://amurahub.westus2.cloudapp.azure.com/health;
        proxy_ssl_server_name on;
        proxy_set_header Host amurahub.westus2.cloudapp.azure.com;
    }

    # SPA Routing (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Cache (1 Year)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Disable access logs for health probes
    location = /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
